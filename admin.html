<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Lupita Marin Photography</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<script>
  // Verificar autenticación antes de cargar la página
  if (!sessionStorage.getItem('adminLoggedIn')) {
    window.location.href = 'index.html';
  }
</script>

<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-brown" href="index.html">Lupita Marin Fotografia</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="categorias.html">Galería</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contacto.html">Contacto</a>
        </li>
        <li class="nav-item">
          <button class="nav-link btn btn-link text-danger" id="logoutBtn" style="border:none; cursor:pointer;">Cerrar Sesión</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<section class="py-5">
  <div class="container">
    <h2 class="text-center text-brown mb-5">Panel de Administración</h2>

    <div class="row">
      <div class="col-md-4">
        <div class="card">
          <div class="card-header">
            <h5>Subir Imágenes</h5>
          </div>
          <div class="card-body">
            <form id="uploadForm">
              <div class="mb-3">
                <label for="categorySelect" class="form-label">Categoría</label>
                <select id="categorySelect" class="form-select" required>
                  <option value="">Seleccionar categoría</option>
                  <option value="boda_civil">Boda Civil</option>
                  <option value="boda_religiosa">Boda Religiosa</option>
                  <option value="xv">XV Años</option>
                  <option value="ceremonias_presentaciones">Presentaciones</option>
                  <option value="ceremonias_bautizos">Bautizos</option>
                  <option value="ceremonias_primeras_comuniones">Primeras Comuniones</option>
                  <option value="propuestas_matrimonio">Propuestas de Matrimonio</option>
                  <option value="sesion_casual">Sesión Casual</option>
                  <option value="sesion_pareja">Sesión en pareja</option>
                  <option value="sesion_cumpleanos">Sesión de cumpleaños</option>
                  <option value="sesion_newborn">Sesión NewBorn</option>
                  <option value="sesion_prenatal">Sesión Prenatal</option>
                  <option value="sesiones_familiares">Sesiones Familiares</option>
                  <option value="sesiones_infantiles">Sesiones Infantiles</option>
                  <option value="sesiones_estudio">Sesiones en Estudio</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="imageInput" class="form-label">Seleccionar imágenes</label>
                <input type="file" id="imageInput" class="form-control" accept="image/*" multiple required>
              </div>
              <button type="submit" class="btn btn-brown">Subir Imágenes</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-md-8">
        <div class="card">
          <div class="card-header">
            <h5>Imágenes por Categoría</h5>
          </div>
          <div class="card-body">
            <div class="mb-3">
              <label for="filterCategory" class="form-label">Filtrar por categoría</label>
              <select id="filterCategory" class="form-select">
                <option value="">Todas las categorías</option>
                <option value="boda_civil">Boda Civil</option>
                <option value="boda_religiosa">Boda Religiosa</option>
                <option value="xv">XV Años</option>
                <option value="ceremonias_presentaciones">Presentaciones</option>
                <option value="ceremonias_bautizos">Bautizos</option>
                <option value="ceremonias_primeras_comuniones">Primeras Comuniones</option>
                <option value="propuestas_matrimonio">Propuestas de Matrimonio</option>
                <option value="sesion_casual">Sesión Casual</option>
                <option value="sesion_pareja">Sesión en pareja</option>
                <option value="sesion_cumpleanos">Sesión de cumpleaños</option>
                <option value="sesion_newborn">Sesión NewBorn</option>
                <option value="sesion_prenatal">Sesión Prenatal</option>
                <option value="sesiones_familiares">Sesiones Familiares</option>
                <option value="sesiones_infantiles">Sesiones Infantiles</option>
                <option value="sesiones_estudio">Sesiones en Estudio</option>
              </select>
            </div>
            <div id="imagesContainer" class="row g-3">
              <!-- Las imágenes se cargarán aquí -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="data/data.js"></script>
<script>
  // categoryTitles ya está definido en data.js

  // Cargar imágenes desde localStorage y data.js
  function loadImages(filterCategory = '') {
    const container = document.getElementById('imagesContainer');
    container.innerHTML = '';

    let allImages = [...MEDIA];

    // Agregar imágenes de localStorage
    const storedImages = JSON.parse(localStorage.getItem('uploadedImages') || '[]');
    allImages = allImages.concat(storedImages);

    if (filterCategory) {
      allImages = allImages.filter(img => img.categoria === filterCategory);
    }

    allImages.forEach((img, index) => {
      const col = document.createElement('div');
      col.className = 'col-md-4 col-sm-6';

      const card = document.createElement('div');
      card.className = 'card gallery-card';

      const imgElement = document.createElement('img');
      imgElement.src = img.src;
      imgElement.className = 'card-img-top';
      imgElement.alt = img.title || 'Imagen';

      const cardBody = document.createElement('div');
      cardBody.className = 'card-body text-center';

      const title = document.createElement('h6');
      title.className = 'card-title';
      title.textContent = categoryTitles[img.categoria] || img.categoria;

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'btn btn-danger btn-sm mt-2';
      deleteBtn.textContent = 'Eliminar';
      deleteBtn.addEventListener('click', () => deleteImage(index, img.src));

      cardBody.appendChild(title);
      cardBody.appendChild(deleteBtn);

      card.appendChild(imgElement);
      card.appendChild(cardBody);
      col.appendChild(card);
      container.appendChild(col);
    });
  }

  // Subir imágenes
  document.getElementById('uploadForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const category = document.getElementById('categorySelect').value;
    const files = document.getElementById('imageInput').files;

    if (!category || files.length === 0) {
      alert('Por favor, selecciona una categoría y al menos una imagen.');
      return;
    }

    const storedImages = JSON.parse(localStorage.getItem('uploadedImages') || '[]');

    Array.from(files).forEach(file => {
      if (file.size > 1024 * 1024) { // 1MB limit
        alert(`La imagen ${file.name} es demasiado grande. Máximo 1MB.`);
        return;
      }
      const reader = new FileReader();
      reader.onload = function(e) {
        const newImage = {
          type: 'image',
          src: e.target.result,
          title: categoryTitles[category],
          categoria: category
        };
        storedImages.push(newImage);
        localStorage.setItem('uploadedImages', JSON.stringify(storedImages));
        loadImages(document.getElementById('filterCategory').value);
      };
      reader.readAsDataURL(file);
    });

    alert('Imágenes subidas exitosamente. Las imágenes aparecerán en la galería después de recargar la página de categorías.');
    document.getElementById('uploadForm').reset();
  });

  // Eliminar imagen
  function deleteImage(index, src) {
    if (confirm('¿Estás seguro de que quieres eliminar esta imagen?')) {
      const storedImages = JSON.parse(localStorage.getItem('uploadedImages') || '[]');
      const imageIndex = storedImages.findIndex(img => img.src === src);
      if (imageIndex !== -1) {
        storedImages.splice(imageIndex, 1);
        localStorage.setItem('uploadedImages', JSON.stringify(storedImages));
        loadImages(document.getElementById('filterCategory').value);
      }
    }
  }

  // Filtrar imágenes
  document.getElementById('filterCategory').addEventListener('change', function() {
    loadImages(this.value);
  });

  // Cargar imágenes al inicio
  loadImages();

  // Cerrar sesión
  document.getElementById('logoutBtn').addEventListener('click', function() {
    sessionStorage.removeItem('adminLoggedIn');
    sessionStorage.removeItem('adminUser');
    window.location.href = 'index.html';
  });
</script>

</body>
</html>
