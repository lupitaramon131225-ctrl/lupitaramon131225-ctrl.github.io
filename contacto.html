<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold text-brown" href="index.html">Lupita Marin Fotografia</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link text-brown" href="index.html">Inicio</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-brown" href="categorias.html">Galería</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-brown" href="contacto.html">Contacto</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-brown" href="#" data-bs-toggle="modal" data-bs-target="#loginModal">Admin</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<section class="section">
  <div class="container">
    <h2 class="title text-center">Cotiza tu evento</h2>
    <div class="row justify-content-center">
      <div class="col-md-6">
        <form action="mailto:tucorreo@email.com" method="POST" enctype="text/plain">
          <div class="mb-3">
            <input type="text" class="form-control" placeholder="Nombre" name="nombre" required>
          </div>
          <div class="mb-3">
            <input type="email" class="form-control" placeholder="Correo" name="correo" required>
          </div>
          <div class="mb-3">
            <textarea class="form-control" placeholder="Describe tu evento" name="mensaje" rows="4"></textarea>
          </div>
          <button class="btn btn-primary">Enviar</button>
        </form>
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <iframe
          src="https://www.google.com/maps/embed?pb="
          width="100%"
          height="300"
          style="border:0;"
          allowfullscreen=""
          loading="lazy">
        </iframe>
      </div>
    </div>
  </div>
</section>

<!-- LOGIN MODAL -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="loginModalLabel">Acceso de Administrador</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="loginForm">
          <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="username" placeholder="Ingresa tu usuario" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña" required>
          </div>
          <div id="loginError" class="alert alert-danger d-none" role="alert">Usuario o contraseña incorrectos</div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-outline-brown" id="loginBtn">Iniciar Sesión</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
  AOS.init({
    duration: 1000,
    once: true
  });

  // Sistema de Login
  const VALID_USER = 'lupita';
  const VALID_PASSWORD = 'Luna85';

  document.getElementById('loginBtn').addEventListener('click', function() {
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('loginError');

    if (username === VALID_USER && password === VALID_PASSWORD) {
      sessionStorage.setItem('adminLoggedIn', 'true');
      sessionStorage.setItem('adminUser', username);
      errorDiv.classList.add('d-none');
      window.location.href = 'admin.html';
    } else {
      errorDiv.classList.remove('d-none');
    }
  });

  document.getElementById('loginForm').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      document.getElementById('loginBtn').click();
    }
  });
</script>
</body>
</html>
