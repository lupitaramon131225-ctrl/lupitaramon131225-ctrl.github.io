<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
</head>

<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-brown" href="index.html">Lupita Marin Fotografia</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link text-brown" href="index.html">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-brown" href="categorias.html">Galería</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-brown" href="contacto.html">Contacto</a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-brown" href="#" data-bs-toggle="modal" data-bs-target="#loginModal">Admin</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="section gallery-section">
    <div class="container">
      <h2 class="title text-center" id="galleryTitle">Galería</h2>
      <p id="categoryDescription" class="gallery-description">Explora cada estilo y motivo de fotografía disponible en la galería.</p>
      <div id="categoryVideoSection" class="category-video-block mb-4 d-none">
        <div class="ratio ratio-16x9 rounded-4 shadow-lg overflow-hidden border border-brown">
          <video id="categoryVideoPlayer" controls preload="metadata" class="w-100 h-100" playsinline>
            <source id="categoryVideoSource" src="" type="video/mp4">
            Tu navegador no soporta videos.
          </video>
        </div>
        <div id="categoryVideoCaption" class="text-center mt-3">
          <h5 class="text-brown mb-1"></h5>
          <p class="text-muted mb-0"></p>
        </div>
      </div>
      <div id="categoryFilters" class="d-flex flex-wrap justify-content-center gap-2 mb-4"></div>
      <div id="galeria" class="gallery-grouped"></div>
    </div>
  </div>

  <!-- LIGHTBOX MODAL -->
  <div id="lightboxModal" class="lightbox-modal">
    <div class="lightbox-content">
      <button class="lightbox-close" id="lightboxClose">&times;</button>
      <img id="lightboxImage" src="" alt="">
    </div>
  </div>

  <!-- LOGIN MODAL -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="loginModalLabel">Acceso de Administrador</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="loginForm">
            <div class="mb-3">
              <label for="username" class="form-label">Usuario</label>
              <input type="text" class="form-control" id="username" placeholder="Ingresa tu usuario" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="password" placeholder="Ingresa tu contraseña" required>
            </div>
            <div id="loginError" class="alert alert-danger d-none" role="alert">Usuario o contraseña incorrectos</div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-outline-brown" id="loginBtn">Iniciar Sesión</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    let categoria = params.get('cat');
    const tipo = params.get('tipo');

    const renderFilterButtons = () => {
      const container = document.getElementById('categoryFilters');
      container.innerHTML = '';

      if (categoria) {
        // Oculta los botones de filtro cuando ya hay una categoría seleccionada.
        container.style.display = 'none';
        return;
      }

      container.style.display = 'flex';

      const createButton = (slug, label) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `btn btn-outline-brown ${categoria === slug ? 'active' : ''}`;
        button.textContent = label;
        button.addEventListener('click', () => {
          categoria = slug;
          updateHeader();
          renderMedia('galeria', categoria, tipo);
          updateUrl();
          renderFilterButtons();
        });
        return button;
      };

      const allButton = document.createElement('button');
      allButton.type = 'button';
      allButton.className = `btn btn-outline-brown ${!categoria ? 'active' : ''}`;
      allButton.textContent = 'Todas';
      allButton.addEventListener('click', () => {
        categoria = null;
        updateHeader();
        renderMedia('galeria', categoria, tipo);
        updateUrl();
        renderFilterButtons();
      });
      container.appendChild(allButton);

      Object.entries(categoryTitles).forEach(([slug, label]) => {
        container.appendChild(createButton(slug, label));
      });
    };

    const updateUrl = () => {
      const url = new URL(window.location);
      if (categoria) {
        url.searchParams.set('cat', categoria);
      } else {
        url.searchParams.delete('cat');
      }
      window.history.replaceState(null, '', url);
    };

    const categoryVideos = {
      boda_religiosa: {
        src: 'assets/vid/boda-2.mp4',
        title: 'Boda Religiosa',
        desc: 'El amor bendecido en cada escena.'
      },
      sesion_pareja: {
        src: 'assets/vid/pareja.mp4',
        title: 'Sesión en Pareja',
        desc: 'Complicidad y ternura juntos.'
      },
      ceremonias_presentaciones: {
        src: 'assets/vid/presentacion.mp4',
        title: 'Presentación Familiar',
        desc: 'Celebración de fe y unión familiar.'
      },
      propuestas_matrimonio: {
        src: 'assets/vid/propuesta.mp4',
        title: 'Propuesta de Matrimonio',
        desc: 'El gran sí capturado en video.'
      },
      xv: {
        src: 'assets/vid/XV.mp4',
        title: 'XV Años',
        desc: 'La magia de tus quince celebrada en movimiento.'
      }
    };

    const updateCategoryVideo = (selectedCategory) => {
      const section = document.getElementById('categoryVideoSection');
      const player = document.getElementById('categoryVideoPlayer');
      const source = document.getElementById('categoryVideoSource');
      const captionTitle = document.querySelector('#categoryVideoCaption h5');
      const captionText = document.querySelector('#categoryVideoCaption p');

      if (!section || !player || !source || !captionTitle || !captionText) {
        return;
      }

      const videoInfo = selectedCategory ? categoryVideos[selectedCategory] : null;
      if (videoInfo) {
        section.classList.remove('d-none');
        source.src = videoInfo.src;
        captionTitle.textContent = videoInfo.title;
        captionText.textContent = videoInfo.desc;
        player.load();
        player.play().catch(() => {});
      } else {
        section.classList.add('d-none');
        player.pause();
        player.currentTime = 0;
      }
    };

    const updateHeader = () => {
      const title = categoria && categoryTitles[categoria] ? categoryTitles[categoria] : 'Galería';
      const description = categoria && categoryDescriptions[categoria]
        ? categoryDescriptions[categoria]
        : 'Explora cada estilo y motivo de fotografía disponible en la galería.';

      document.getElementById('galleryTitle').textContent = title;
      document.getElementById('categoryDescription').textContent = description;
      updateCategoryVideo(categoria);
    };

    document.addEventListener('DOMContentLoaded', () => {
      updateHeader();
      renderFilterButtons();
      renderMedia('galeria', categoria, tipo);
    });
  </script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init({
      duration: 1000,
      once: true
    });

    // Sistema de Login
    const VALID_USER = 'lupita';
    const VALID_PASSWORD = 'Luna85';

    document.getElementById('loginBtn').addEventListener('click', function () {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('loginError');

      if (username === VALID_USER && password === VALID_PASSWORD) {
        sessionStorage.setItem('adminLoggedIn', 'true');
        sessionStorage.setItem('adminUser', username);
        errorDiv.classList.add('d-none');
        window.location.href = 'admin.html';
      } else {
        errorDiv.classList.remove('d-none');
      }
    });

    document.getElementById('loginForm').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        document.getElementById('loginBtn').click();
      }
    });
  </script>
</body>

</html>
